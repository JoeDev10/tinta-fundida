# Corre las pruebas en cada push. Si algo se rompe, GitHub manda un mail y
# el commit queda marcado con una cruz roja en la lista de commits.
#
# Las 23 pruebas del panel se saltean acá: abren admin.html, que no está en
# el repo a propósito. Esas hay que correrlas en la computadora del dueño,
# entrando a http://localhost:5173/tests/ antes de publicar.

name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Sitio público
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar lo que hace falta
        run: npm ci --no-audit --no-fund

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Correr las pruebas
        run: node scripts/correr-pruebas.mjs
