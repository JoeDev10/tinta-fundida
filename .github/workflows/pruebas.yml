# Corre las pruebas en cada push. Si algo se rompe, GitHub manda un mail y
# el commit queda marcado con una cruz roja en la lista de commits.
#
# Corren las 93, incluidas las del panel. Antes esas se salteaban porque
# admin.html no estaba en el repo; desde que el panel se publica junto con
# el sitio, no queda nada afuera.

name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Sitio público
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar lo que hace falta
        run: npm ci --no-audit --no-fund

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Correr las pruebas
        run: node scripts/correr-pruebas.mjs
