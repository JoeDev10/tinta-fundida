<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Tinta Fundida</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06070b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2306070b'/><path d='M50 18 82 36v36L50 90 18 72V36z' fill='none' stroke='%23b8ff29' stroke-width='6'/></svg>">

<!-- ============================================================
     GitHub Pages muestra esta página cuando alguien entra a una
     dirección que no existe: un link mal pegado, una letra de más.
     Sin este archivo mostraría su propia pantalla gris, sin salida
     y sin la marca por ningún lado.

     Va con todo el diseño adentro y sin depender de css/estilo.css
     a propósito: esta página aparece en cualquier dirección
     inventada, y desde una dirección inventada las rutas relativas
     apuntan a cualquier lado. Sin archivos afuera, no hay nada que
     se pueda romper.
     ============================================================ -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;background:#06070b;color:#b9c0d2;
    font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:2rem;text-align:center;position:relative;overflow:hidden;
  }
  .grilla{
    position:absolute;inset:0;opacity:.3;pointer-events:none;
    background-image:linear-gradient(#242a3b 1px,transparent 1px),
                     linear-gradient(90deg,#242a3b 1px,transparent 1px);
    background-size:44px 44px;
  }
  .brillo{
    position:absolute;width:700px;height:700px;border-radius:50%;
    top:-280px;right:-200px;pointer-events:none;
    background:radial-gradient(circle,rgba(184,255,41,.16),transparent 68%);
  }
  .caja{position:relative;max-width:34rem}
  .cubo{width:96px;height:96px;margin:0 auto 2rem;
    filter:drop-shadow(0 0 18px rgba(184,255,41,.35))}
  .codigo{
    font-family:'IBM Plex Mono','Consolas',monospace;
    font-size:.82rem;letter-spacing:.28em;color:#b8ff29;
    text-transform:uppercase;margin-bottom:1.1rem;
  }
  h1{
    font-family:'Chakra Petch','Segoe UI',sans-serif;
    font-size:clamp(1.8rem,6vw,2.9rem);line-height:1.1;
    color:#eaeefb;font-weight:700;letter-spacing:-.01em;
  }
  p{margin-top:1rem;font-size:1.05rem;line-height:1.6;color:#6f7793}
  .btn{
    display:inline-flex;align-items:center;gap:.6rem;margin-top:2.2rem;
    background:#b8ff29;color:#06070b;text-decoration:none;
    font-weight:600;font-size:1rem;padding:.9rem 1.7rem;
    border:1px solid #b8ff29;transition:box-shadow .2s,transform .2s;
  }
  .btn:hover{box-shadow:0 0 22px rgba(184,255,41,.45);transform:translateY(-2px)}
  .btn:focus-visible{outline:2px solid #eaeefb;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>

<div class="grilla" aria-hidden="true"></div>
<div class="brillo" aria-hidden="true"></div>

<main class="caja">
  <svg class="cubo" viewBox="0 0 100 100" fill="none" stroke="#b8ff29"
       stroke-width="2.6" stroke-linejoin="round" aria-hidden="true">
    <path d="M50 10 88 31v42L50 94 12 73V31z"/>
    <path d="m12 31 38 21 38-21M50 52v42"/>
  </svg>

  <p class="codigo">Error 404</p>
  <h1>Esta página no existe</h1>
  <p>
    Puede que el link esté cortado o que la dirección tenga una letra de más.
    El catálogo sigue donde siempre.
  </p>

  <a class="btn" href="https://joedev10.github.io/tinta-fundida/">
    Ir al sitio
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
         stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </svg>
  </a>
</main>

</body>
</html>
